<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a4f49">
<title>بوابة أولياء الأمور — كشف الحساب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14283d;--mut:#5d6d7e;--line:#e1e8f0;--bg:#eef2f6;--brand:#0f6b63;--brand-d:#0a4f49;--gold:#e0b04a;--due:#a8480a;--ok:#13763b;--err:#b3261e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;min-height:100vh;padding-bottom:110px}
.hero{background:radial-gradient(circle at 15% 20%,#1b8a7f55 0,transparent 45%),radial-gradient(circle at 90% 80%,#e0b04a2e 0,transparent 40%),linear-gradient(135deg,#093f3a,#0f6b63);color:#fff;padding:34px 16px 84px;text-align:center}
.logo{width:68px;height:68px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;background:#ffffff1f;border:1px solid #ffffff40;backdrop-filter:blur(6px);color:var(--gold)}
.hero h1{margin:0;font-size:1.55rem;font-weight:800}.hero p{margin:4px 0 0;opacity:.82;font-size:.95rem}
.wrap{max-width:780px;margin:-56px auto 0;padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 36px rgba(20,40,61,.1)}
#login{max-width:440px;margin:0 auto}#login h2{margin:0 0 4px;font-size:1.25rem}.sub{margin:0 0 18px;color:var(--mut);font-size:.93rem}
.field{margin-bottom:14px}.field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.inp{position:relative}.inp>span{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:#8a9aab;display:flex;pointer-events:none}
.inp input{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 46px;font:inherit;font-size:1.05rem;background:#f8fafc;color:var(--ink);direction:ltr;text-align:center;letter-spacing:.12em;font-weight:700;transition:.15s}
.inp input::placeholder{letter-spacing:0;font-weight:400;color:#9aa8b6}
.inp input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(15,107,99,.14)}.inp:focus-within>span{color:var(--brand)}
.eye{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:#8a9aab;cursor:pointer;border-radius:10px;display:grid;place-items:center}.eye:hover{background:#eef2f6}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 16px;font-size:.9rem}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--brand)}
.link{background:none;border:0;color:var(--brand);font:inherit;font-weight:700;cursor:pointer;padding:4px}.link:hover{text-decoration:underline}
.btn{width:100%;height:54px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;position:relative;box-shadow:0 8px 20px rgba(15,107,99,.3);transition:.15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.8;cursor:wait;transform:none}
.btn.ld::after{content:"";position:absolute;inset-inline-start:18px;top:17px;width:18px;height:18px;border:3px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.btn:focus-visible,.link:focus-visible,select:focus-visible,.fab:focus-visible,.eye:focus-visible{outline:3px solid #7cc4bc;outline-offset:2px}
.err,.info{border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.93rem}.err{background:#fdecea;border:1px solid #f4b8b3;color:var(--err);font-weight:500}.info{background:#eef6fb;border:1px solid #cfe2f1}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px}.av{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--brand),#17948a);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.3rem;flex:none}
.who h2{margin:0;font-size:1.15rem}.who small{color:var(--mut)}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar select{height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:#fff}
.badge{padding:3px 12px;border-radius:99px;font-size:.82rem;font-weight:700}.b-ok{background:#e4f6ea;color:var(--ok)}.b-due{background:#fff0e0;color:var(--due)}
.top{display:flex;gap:16px;align-items:center;margin-bottom:14px}.ring{position:relative;width:112px;height:112px;flex:none}.ring svg{transform:rotate(90deg) scaleX(-1)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.35rem;font-weight:800}
.sum{flex:1;display:grid;gap:8px}.t{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#f8fafc}.t i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-style:normal}
.t span{color:var(--mut);font-size:.82rem;display:block;line-height:1.3}.t b{font-size:1.15rem}.t div{flex:1}
.i1{background:#e7eef7;color:#2c5282}.i2{background:#e4f6ea;color:var(--ok)}.i3{background:#fff0e0;color:var(--due)}
.note{background:#fff9e8;border:1px solid #f0dca4;border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:.9rem}
h3{margin:22px 0 10px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.li strong{display:block}.chip{display:inline-block;background:#eaf3f2;color:var(--brand-d);border-radius:8px;padding:0 9px;font-size:.78rem;font-weight:700;margin-inline-end:6px}.mut{color:var(--mut);font-size:.82rem}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.pos{color:var(--ok)}
.tot{display:flex;justify-content:space-between;padding:10px 12px;font-weight:800}
.empty{color:var(--mut);padding:12px 4px}footer{text-align:center;color:var(--mut);font-size:.8rem;margin:18px 0}
.fabs{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;z-index:20}
.fab{width:54px;height:54px;border-radius:50%;border:0;color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.25);text-decoration:none;transition:.18s;animation:fl 3.2s ease-in-out infinite}
.fab:nth-child(2){animation-delay:.5s}.fab:nth-child(3){animation-delay:1s}.fab:hover{transform:scale(1.1)}@keyframes fl{50%{transform:translateY(-4px)}}
.wa{background:#1fae5b}.cl{background:var(--brand)}.pr{background:#2c5282}
@media(prefers-reduced-motion:reduce){.fab{animation:none}.btn.ld::after{animation-duration:2s}}
@media(max-width:480px){.top{flex-direction:column}.card{padding:16px}.hero{padding-bottom:78px}}
@media print{.hero,.fabs,.noprint{display:none!important}.wrap{margin:0}.card{box-shadow:none}body{background:#fff}}
</style></head><body>
<header class="hero"><div class="logo" data-i="cap"></div><h1 id="school">بوابة أولياء الأمور</h1><p>الاستعلام عن الرسوم الدراسية والمدفوعات</p></header>
<main class="wrap">
<section id="login" class="card"><h2>تسجيل الدخول</h2><p class="sub">أدخل رقم هاتفك المسجّل لدى المدرسة والرمز الذي استلمته من الإدارة.</p>
<form id="f" autocomplete="off" novalidate>
<div id="err" class="err" role="alert" hidden></div><div id="info" class="info" hidden></div>
<div class="field"><label for="ph">رقم الهاتف</label><div class="inp"><span data-i="phone"></span><input id="ph" type="tel" inputmode="tel" placeholder="09XXXXXXXX" required></div></div>
<div class="field"><label for="cd">رمز الدخول</label><div class="inp"><span data-i="lock"></span><input id="cd" type="password" inputmode="numeric" maxlength="8" placeholder="••••••" required><button type="button" class="eye" id="eye" aria-label="إظهار الرمز" data-i="eye"></button></div></div>
<div class="row"><label class="chk"><input type="checkbox" id="rem" checked> تذكّر بياناتي على هذا الجهاز</label><button type="button" class="link" id="forgot">نسيت الرمز؟</button></div>
<button id="go" class="btn" type="submit">عرض كشف الحساب</button></form></section>

<section id="res" hidden><div class="card">
<div class="bar noprint"><select id="fam" aria-label="اختر السنة الدراسية"></select><button class="link" id="out">خروج ونسيان البيانات</button></div>
<div class="who"><div class="av" id="av"></div><div><h2 id="fname"></h2><small id="upd"></small></div></div>
<div class="top"><div class="ring"><svg width="112" height="112" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#e3eaf1" stroke-width="10"/><circle id="rg" cx="50" cy="50" r="42" fill="none" stroke="var(--brand)" stroke-width="10" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9" style="transition:stroke-dashoffset .8s ease"/></svg><b id="pct"></b></div><div class="sum" id="sum"></div></div>
<div id="disc" class="note" hidden></div>
<h3><span data-i="users" style="color:var(--brand);display:flex"></span> الطلاب</h3><div id="st"></div>
<h3><span data-i="receipt" style="color:var(--brand);display:flex"></span> سندات القبض</h3><div id="rc"></div>
</div><footer>هذا الكشف للاطلاع فقط. عند وجود أي اختلاف يرجى مراجعة إدارة المدرسة.</footer></section>
</main>
<nav class="fabs noprint" aria-label="إجراءات سريعة"><a class="fab wa" id="fwa" target="_blank" rel="noopener" aria-label="تواصل عبر واتساب" title="واتساب المدرسة" data-i="chat" hidden></a><a class="fab cl" id="fcl" aria-label="اتصال بالمدرسة" title="اتصال بالمدرسة" data-i="phone" hidden></a><button class="fab pr" id="fpr" aria-label="طباعة الكشف" title="طباعة الكشف" data-i="print" hidden></button></nav>
<script>
const CFG={url:'https://zkcvootlghmnrvrqmhmr.supabase.co',key:'sb_publishable_KECSSauUnf--sim1ecy9dg_o6dZZ_ct',
 whatsapp:'',  // رقم واتساب المدرسة بالصيغة الدولية بدون + مثل 218912345678 (اتركه فارغًا لإخفاء الزر)
 phone:''};    // رقم اتصال المدرسة مثل +218912345678 (اتركه فارغًا لإخفاء الزر)
const P={cap:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
print:'<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',
users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
receipt:'<path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .7V2l-1 .7-3-2-3 2-3-2-3 2z"/><path d="M8 8h8M8 12h8"/>',
sum:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',ok:'<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'};
const ic=(k,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i,e.classList.contains('fab')?24:e.classList.contains('logo')?34:20));
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function applyCfg(){const w=String(CFG.whatsapp||'').replace(/\D/g,'');$('#fwa').hidden=!w;if(w)$('#fwa').href='https://wa.me/'+w;$('#fcl').hidden=!CFG.phone;if(CFG.phone)$('#fcl').href='tel:'+CFG.phone}
async function loadCfg(){try{const r=await fetch(CFG.url+'/rest/v1/sp_settings?select=key,value',{headers:{apikey:CFG.key}});if(r.ok)(await r.json()).forEach(x=>{if(x.value&&(x.key==='whatsapp'||x.key==='phone'))CFG[x.key]=x.value})}catch{}applyCfg()}
applyCfg();const cfgP=loadCfg();
$('#fpr').onclick=()=>print();$('#eye').onclick=()=>{const c=$('#cd');c.type=c.type==='password'?'text':'password'};
$('#forgot').onclick=async()=>{await cfgP;const p=$('#ph').value.trim(),i=$('#info');$('#err').hidden=true;
 if(CFG.whatsapp){location.href='https://wa.me/'+String(CFG.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent('السلام عليكم، نسيت رمز الدخول إلى بوابة أولياء الأمور.'+(p?' رقم هاتفي المسجّل لديكم: '+p:''))}
 else{i.textContent='لإعادة إصدار الرمز تواصل مع إدارة المدرسة'+(CFG.phone?' على الرقم '+CFG.phone:'')+'، وسيصلك رمز جديد.';i.hidden=false}};
let data;const K='sp_cred';
async function login(auto){const b=$('#go'),er=$('#err');er.hidden=true;$('#info').hidden=true;b.disabled=true;b.classList.add('ld');
 try{const phone=$('#ph').value,code=$('#cd').value;
 const r=await fetch(CFG.url+'/functions/v1/lookup',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key,Authorization:'Bearer '+CFG.key},body:JSON.stringify({phone,code})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'تعذر الاتصال بالخادم، حاول لاحقًا'),{st:r.status});
 if(!j.families?.length)throw new Error('لا توجد بيانات مسجلة لهذا الرقم');
 try{$('#rem').checked?localStorage.setItem(K,JSON.stringify({phone,code})):localStorage.removeItem(K)}catch{}
 data=j;show()}
 catch(x){if(auto&&x.st===401)try{localStorage.removeItem(K)}catch{};er.textContent=x.message;er.hidden=false}finally{b.disabled=false;b.classList.remove('ld')}}
$('#f').addEventListener('submit',e=>{e.preventDefault();login(false)});
$('#out').onclick=()=>{try{localStorage.removeItem(K)}catch{};location.reload()};
try{const s=JSON.parse(localStorage.getItem(K)||'null');if(s){$('#ph').value=s.phone;$('#cd').value=s.code;login(true)}}catch{}
function show(){$('#login').hidden=true;$('#res').hidden=false;$('#fpr').hidden=false;$('#school').textContent=data.school||'بوابة أولياء الأمور';document.title=$('#school').textContent+' — كشف الحساب';
 $('#fam').innerHTML=data.families.map((f,i)=>`<option value="${i}">العام الدراسي ${esc(f.year)}</option>`).join('');$('#fam').hidden=data.families.length<2;$('#fam').onchange=()=>draw(+$('#fam').value);draw(0)}
function draw(i){const f=data.families[i],rem=f.total_fees-f.paid,p=f.total_fees?Math.max(0,Math.min(100,Math.round(f.paid/f.total_fees*100))):0;
 $('#av').textContent=(f.name||'؟').trim().charAt(0);
 $('#fname').innerHTML=esc(f.name)+' <span class="badge '+(rem>0?'b-due':'b-ok')+'">'+(rem>0?'قيد السداد':'مسدَّد بالكامل')+'</span>';
 $('#upd').textContent=data.updated_at?'آخر تحديث: '+new Date(data.updated_at).toLocaleString('ar-LY'):'';
 $('#pct').textContent=p+'%';requestAnimationFrame(()=>$('#rg').style.strokeDashoffset=263.9*(1-p/100));
 $('#sum').innerHTML=`<div class="t"><i class="i1">${ic('sum')}</i><div><span>إجمالي الرسوم</span><b>${fmt(f.total_fees)}</b></div></div><div class="t"><i class="i2">${ic('ok')}</i><div><span>المدفوع</span><b>${fmt(f.paid)}</b></div></div><div class="t"><i class="i3">${ic('clock')}</i><div><span>المتبقي</span><b>${fmt(Math.max(0,rem))}</b></div></div>`;
 const d=$('#disc');d.hidden=!(f.discount_type&&f.discount_type!=='none'&&f.discount_value>0);if(!d.hidden)d.textContent='تم احتساب خصم على الرسوم'+(f.discount_reason?' ('+f.discount_reason+')':'')+'.';
 $('#st').innerHTML=f.students.length?f.students.map(s=>`<div class="li"><div><strong>${esc(s.name)}</strong><span class="chip">${esc(s.grade)}</span></div><span class="amt">${fmt(s.price)} د.ل</span></div>`).join(''):'<div class="empty">لا يوجد طلاب مسجلون.</div>';
 $('#rc').innerHTML=f.receipts.length?f.receipts.map(r=>`<div class="li"><div><strong>${esc(r.date)}</strong><span class="chip">${esc(r.method||'—')}</span>${r.ref&&r.ref!=='-'?`<span class="mut">مرجع: ${esc(r.ref)}</span>`:''}</div><span class="amt pos">+${fmt(r.amount)} د.ل</span></div>`).join('')+`<div class="tot"><span>إجمالي المدفوع</span><span>${fmt(f.receipts.reduce((a,r)=>a+Number(r.amount),0))} د.ل</span></div>`:'<div class="empty">لا توجد دفعات مسجلة بعد.</div>'}
</script></body></html>
